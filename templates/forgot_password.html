<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password help · Mzanzi Retail Group</title>
  <style nonce="{{ csp_nonce }}">
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eff3f7;color:#203040;font:14px/1.6 "Segoe UI",Arial,sans-serif}.card{width:min(480px,100%);padding:30px;border:1px solid #e0e7ef;border-radius:12px;background:#fff;box-shadow:0 18px 50px #18324b16}h1{margin:0 0 10px;color:#18324b;font-size:23px}p{color:#64748b}a{color:#2878b5;text-decoration:none}a:hover{text-decoration:underline}.notice{padding:12px;border-radius:6px;background:#f1f7fb;color:#334e63}
  </style>
</head>
<body>
  <main class="card">
    <h1>Password help</h1>
    <p class="notice">{{ message }}</p>
    <p>For security, this local project does not send reset emails. Ask an administrator to set a new password from the User Management page.</p>
    <a href="{{ url_for('login') }}">Return to sign in</a>
  </main>
</body>
</html>
